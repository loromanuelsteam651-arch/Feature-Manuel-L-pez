    <main>

        <section>
            <h1>Contacto</h1>
            <form action="#" method="post">
                <fieldset>
                    <legend class="legend"> <strong>Datos personales</strong> </legend>

                        <div class="form">
                            <label for="nombre">Nombre:</label>
                            <input placeholder="Tu nombre"type="text" id="nombre" name="nombre" required>
                        </div>

                        <div class="form">
                            <label for="email">Correo electrónico:</label>
                            <input placeholder="Escribe el asunto de tu asunto aquí..."type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form">
                            <label for="asunto">Asunto:</label>
                            <input placeholder="Tu@email.com..."type="text" id="asunto" name="asunto" required>
                        </div>

                        <div class="form">
                          <label for="mensaje">Mensaje:</label>
                        
                          <textarea
                            id="mensaje"
                            name="mensaje"
                            rows="5"
                            placeholder="Escribe tu mensaje aquí..."
                            required
                          ></textarea>
                        </div>
                </fieldset>

                            
                <button class="btn-primary" type="submit">Enviar</button>
                <button  class="btn-primary" type="reset">Borrar formulario</button>
        </section>

        

    </main>
